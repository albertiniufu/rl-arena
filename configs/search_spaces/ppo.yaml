# Espaço de busca do PPO para a campanha BO genérica.
algorithm: ppo
params:
  - name: lr
    type: float
    low: 0.0001
    high: 0.001
    log: true
  - name: batch_size
    type: choice
    choices: [64, 128, 256]
  - name: rollout_steps
    type: choice
    choices: [512, 1024, 2048]
  - name: epochs
    type: choice
    choices: [2, 4, 8]
  - name: clip
    type: float
    low: 0.1
    high: 0.3
  - name: entropy_coef
    type: float
    low: 0.0
    high: 0.02
  - name: gae_lambda
    type: float
    low: 0.9
    high: 0.99
  - name: max_grad_norm
    type: float
    low: 0.5
    high: 10.0
  - name: value_coef
    type: float
    low: 0.25
    high: 1.0
